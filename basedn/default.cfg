// Duke3D defaults; config.cfg holds user overrides.
set vid_ref gl
set vid_fullscreen 0
set gl_mode 6
set gl_ext_palettedtexture 0
set gl_texturemode GL_NEAREST
set intensity 1
set vid_gamma 1
set freelook 1
set m_pitch 0.022
set cl_run 1
set s_music 1
set s_musicvolume 0.5
set s_menu_music 1
set noipx 1
set name Duke
set hostname "Duke3D Quake server"
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +moveup
bind c +movedown
bind SHIFT +speed
bind e +use
bind MOUSE1 +attack
bind MOUSE2 +moveup
bind MWHEELUP weapprev
bind MWHEELDOWN weapnext
bind ` toggleconsole
bind ~ toggleconsole
bind ESCAPE togglemenu
bind F2 menu_savegame
bind F3 menu_loadgame
bind F6 quicksave
bind F9 quickload
bind 1 "use 0"
bind 2 "use 1"
bind 3 "use 2"
bind 4 "use 3"
bind 5 "use 4"
bind 6 "use 5"
bind 7 "use 6"
bind 8 "use 7"
bind 9 "use 8"
bind 0 "use 9"
